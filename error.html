<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | Tangram</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111111">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'TTOctosquares';src:url('/fonts/TTOctosquares-DemiBold.woff2') format('woff2'),url('/fonts/TTOctosquares-DemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap}
:root{--bg:#111;--text:#F4F1EC;--muted:#c0c0c0;--accent:#EE6D3E;--line:#3a3a3a}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem 1.25rem}
main{width:min(560px,100%)}
.logo{display:block;height:34px;width:auto;margin-bottom:3rem}
.code{margin:0 0 .6rem;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{margin:0;font-family:'TTOctosquares','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.05}
p{color:var(--muted);line-height:1.6;margin:1rem 0 0}
a.btn{display:inline-flex;align-items:center;margin-top:2rem;min-height:52px;padding:0 2.2rem;background:var(--accent);color:#111;text-decoration:none;font-weight:700;font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
a.btn:hover{filter:brightness(1.1)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.es{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--line)}
.es a{color:var(--text);text-decoration-color:var(--accent);text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <a href="/" aria-label="Tangram"><img class="logo" src="/assets/images/logo.webp" alt="Tangram" width="1450" height="482"></a>
  <p class="code">Error 404</p>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a class="btn" href="/">Back to home</a>
  <p class="es">Esta página no existe o se movió. <a href="/es/index.html">Volver al inicio</a>.</p>
</main>
</body>
</html>
